<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0c1a30"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12243b"/>
      <stop offset="1" stop-color="#0e1c30"/>
    </linearGradient>
    <linearGradient id="fly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35d07f"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8aa0b8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#35d07f"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="70" y="82" fill="#eaf2fb" font-size="38" font-weight="700">Fly Weight-Lab — Architecture</text>
  <text x="72" y="120" fill="#8aa0b8" font-size="19">Your body runs one experiment. The flies run ten thousand.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="166" width="330" height="150" rx="18" fill="url(#box)" stroke="#2d4868" stroke-width="1.5"/>
    <text x="100" y="208" fill="#35d07f" font-size="22" font-weight="700">01 · User signals</text>
    <text x="100" y="242" fill="#c9d8ea" font-size="16">weekly weight</text>
    <text x="100" y="270" fill="#c9d8ea" font-size="16">adherence · sleep · food</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="166" width="340" height="150" rx="18" fill="url(#box)" stroke="#2d4868" stroke-width="1.5"/>
    <text x="500" y="208" fill="#4cc9f0" font-size="22" font-weight="700">02 · Behavioral twin</text>
    <text x="500" y="242" fill="#c9d8ea" font-size="16">adherence prediction</text>
    <text x="500" y="270" fill="#c9d8ea" font-size="16">weight trajectory · binge risk</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="890" y="166" width="340" height="150" rx="18" fill="url(#box)" stroke="#2d4868" stroke-width="1.5"/>
    <text x="920" y="208" fill="#ffd166" font-size="22" font-weight="700">03 · Connectome prior</text>
    <text x="920" y="242" fill="#c9d8ea" font-size="16">Janelia MaleCNS</text>
    <text x="920" y="270" fill="#c9d8ea" font-size="16">reward : punishment = 2.56 : 1</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1290" y="166" width="240" height="150" rx="18" fill="url(#fly)" stroke="#12243b" stroke-width="1.5"/>
    <text x="1320" y="208" fill="#07111f" font-size="22" font-weight="700">04 · Fruit-fly swarm</text>
    <text x="1320" y="242" fill="#07111f" font-size="16">spawn · breed</text>
    <text x="1320" y="270" fill="#07111f" font-size="16">mutate · cull</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1020" y="430" width="380" height="160" rx="18" fill="url(#box)" stroke="#2d4868" stroke-width="1.5"/>
    <text x="1050" y="476" fill="#35d07f" font-size="22" font-weight="700">05 · Decision surface</text>
    <text x="1050" y="512" fill="#c9d8ea" font-size="16">quiet background agent</text>
    <text x="1050" y="542" fill="#c9d8ea" font-size="16">one decision · one reason</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1020" y="660" width="380" height="150" rx="18" fill="url(#box)" stroke="#2d4868" stroke-width="1.5"/>
    <text x="1050" y="706" fill="#4cc9f0" font-size="22" font-weight="700">06 · AgentCore Runtime</text>
    <text x="1050" y="740" fill="#c9d8ea" font-size="16">POST /invocations</text>
    <text x="1050" y="768" fill="#c9d8ea" font-size="16">GET /ping</text>
  </g>

  <line x1="400" y1="241" x2="470" y2="241" stroke="#8aa0b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="241" x2="890" y2="241" stroke="#8aa0b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1230" y1="241" x2="1290" y2="241" stroke="#8aa0b8" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M1200 316 C1200 392 1130 412 1090 430" fill="none" stroke="#8aa0b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1130 590 L1130 660" fill="none" stroke="#8aa0b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1410 590 L1270 590 L1270 660" fill="none" stroke="#35d07f" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="1310" y="575" fill="#35d07f" font-size="16">one surfaced decision</text>
  <text x="1148" y="632" fill="#8aa0b8" font-size="16">deploy</text>

  <text x="70" y="838" fill="#637b96" font-size="15">Behavioral model, not a metabolic simulator. Connectome grounding is a structural prior, not a claim that a human brain equals a fly brain.</text>
  <text x="70" y="864" fill="#8aa0b8" font-size="15">Includes CSV calibration, safety guardrails, durable memory, structured telemetry, offline evaluation, and a Vercel-ready web demo.</text>
</svg>
